[project]
name = "city-intelligence"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
authors = [
    { name = "Sheharyar-Sarmad", email = "developersheharyar2010@gmail.com" }
]
requires-python = ">=3.13"
dependencies = [
    "langchain>=1.4.3",
    "langchain-community>=0.4.2",
    "langchain-core>=1.6.6",
    "langchain-groq>=1.1.3",
    "langchain-tavily>=0.2.18",
    "python-dotenv>=1.2.4",
    "rich>=15.0.0",
    "streamlit>=1.64.0",
    "tavily>=1.1.0",
]

[project.scripts]
city-intelligence = "city_intelligence:main"

[build-system]
requires = ["uv_build>=0.12.16,<0.13.0"]
build-backend = "uv_build"
